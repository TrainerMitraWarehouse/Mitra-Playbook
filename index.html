        .ut-link-item:hover { color: var(--primary); }

            background-color: #e0f2fe;
            padding: 6px 14px;

        }

        .btn-myut-layout {

            border: 2px solid var(--primary);
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;

            transition: 0.2s;

        /* --- BANNER HIGHLIGHT --- */
        .highlight-container {
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(153, 58, 142, 0.15);
            border: 1px solid var(--border);
        }

        .banner-image-wrapper {
            width: 100%;
            height: 180px; 
            overflow: hidden;
            position: relative;
        }

        .banner-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .running-text-wrapper {
            background: var(--primary);
            color: white;
            padding: 10px 0;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        .running-text {
            display: inline-block;
            padding-left: 100%;
            font-weight: 700;
            font-size: 1.1rem;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .running-text-wrapper:hover .running-text {
            animation-play-state: paused;
        }

        .result-box h4 { margin: 0 0 5px 0; color: var(--text); }

</head>

            <h2 style="color: #033980;">Login Mitra Aktif</h2>
            <input type="text" id="loginNoHp" class="input-field" placeholder="Nomor HP">
            <input type="password" id="loginStaffId" class="input-field" placeholder="Staff ID">
            <button onclick="prosesLogin()" id="btnLogin" class="btn-login">Login</button>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFlMgaUkKkyTRrdvQGvtFGup3BZTjlEHfVPsY1D1j_bgMzkHalHC9PzO_UCAdsgi4/exec";

    // FUNGSI LOGIN (TIDAK LAGI TERPERANGKAP)
    function prosesLogin() {
        let nohp = document.getElementById('loginNoHp').value;
        let staffid = document.getElementById('loginStaffId').value;
        let btn = document.getElementById('btnLogin');
        btn.innerText = "Memverifikasi...";
        fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ nohp: nohp, staffid: staffid }) })
        .then(res => res.json())
        .then(data => {
            if(data.status === "sukses") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('appContainer').style.display = "flex";
                sessionStorage.setItem("mitraAktivated", "true");
            } else { alert("Data salah!"); btn.innerText = "Login"; }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        if(sessionStorage.getItem("mitraAktivated") === "true") {
            document.getElementById('loginScreen').style.display = "none";
            document.getElementById('appContainer').style.display = "flex";
        }
    });

    function openTab(evt, tabName) {
        let sections = document.getElementsByClassName("content-section");
        for (let i = 0; i < sections.length; i++) {
            sections[i].classList.remove("active");
        }

        let menuItems = document.querySelectorAll("#menuList li");
        menuItems.forEach(item => item.classList.remove("active"));

        let targetSection = document.getElementById(tabName);
        if(targetSection) {
            targetSection.classList.add("active");
        }
        evt.currentTarget.classList.add("active");
    }

    function searchGlobal() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('card');

        for (let i = 0; i < cards.length; i++) {
            let text = cards[i].innerText.toLowerCase();

            if (text.includes(input)) {
                cards[i].style.display = "block";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    function hitungKomisiDanJadwal() {
        let joinDateVal = document.getElementById('joinDate').value;
        let shift = parseFloat(document.getElementById('jumlahShift').value) || 0;
        let rate = parseFloat(document.getElementById('rateKomisi').value) || 0;
        
        if (!joinDateVal) {
            alert("Silakan pilih Tanggal Join terlebih dahulu!");
            return;
        }

        let totalUang = shift * rate;
        let formatRupiah = new Intl.NumberFormat('id-ID', {
            style: 'currency', currency: 'IDR', minimumFractionDigits: 0
        }).format(totalUang);
        document.getElementById('totalKomisiResult').innerText = formatRupiah;

        let parts = joinDateVal.split('-');
        let tahunJoin = parseInt(parts[0], 10);
        let bulanJoin = parseInt(parts[1], 10) - 1; 
        let tanggalJoin = parseInt(parts[2], 10);

        let tanggalBayar = 0;
        let targetBulan = bulanJoin;
        let targetTahun = tahunJoin;

        if (tanggalJoin >= 25) {
            tanggalBayar = 19;
            targetBulan = bulanJoin + 1; 
        } 
        else if (tanggalJoin <= 10) {
            tanggalBayar = 19;
            targetBulan = bulanJoin;     
        }
        else if (tanggalJoin >= 11 && tanggalJoin <= 24) {
            tanggalBayar = 5;
            targetBulan = bulanJoin + 1; 
        }

        let gajianDate = new Date(targetTahun, targetBulan, tanggalBayar);
        let opsiFormat = { day: '2-digit', month: 'long', year: 'numeric' };
        let formatTanggalFinal = gajianDate.toLocaleDateString('id-ID', opsiFormat);

        document.getElementById('tanggalBayarResult').innerText = formatTanggalFinal;
        }
        
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFlMgaUkKkyTRrdvQGvtFGup3BZTjlEHfVPsY1D1j_bgMzkHalHC9PzO_UCAdsgi4/exec";

    function prosesLogin() {
        let nohp = document.getElementById('loginNoHp').value;
        let staffid = document.getElementById('loginStaffId').value;
        let btn = document.getElementById('btnLogin');
    
        btn.innerText = "Memverifikasi...";
    
        fetch(WEB_APP_URL, { 
        method: "POST", 
        // Mode 'no-cors' terkadang membuat status tidak terbaca di fetch biasa
        // Jika tetap tidak memproses, gunakan mode: 'cors' dan pastikan Apps Script mengembalikan header akses
        body: JSON.stringify({ nohp: nohp, staffid: staffid }) 
        })
        .then(res => res.json())
        .then(data => {
        if(data.status === "sukses") {
        document.getElementById('loginScreen').style.display = "none";
        document.getElementById('appContainer').style.display = "flex";
        sessionStorage.setItem("mitraAktivated", "true");
        } else {
        alert("Nomor HP atau Staff ID tidak terdaftar!");
        btn.innerText = "Masuk Sistem";
        }
        })
        .catch(err => {
        console.error(err);
        alert("Gagal terhubung ke server login. Pastikan sudah di-deploy.");
        btn.innerText = "Masuk Sistem";
        });
        }
        window.addEventListener('DOMContentLoaded', () => {
        if(sessionStorage.getItem("mitraAktivated") === "true") {
        document.getElementById('loginScreen').style.display = "none";
        document.getElementById('appContainer').style.display = "flex";
        }
        });
        }
        </script>
