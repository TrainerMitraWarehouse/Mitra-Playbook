<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitra Playbook</title>
    <style>
        :root {
            --primary: #033980;
            --bg: #64b1fa;
            --text: #1e293b;
            --border: #bce2fd;
            --white: #ffffff;
        }
        
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--bg); color: var(--text); }
        
        /* Sidebar Navigasi Kiri - Warna Asli Sesuai GitHub */
        nav { width: 280px; height: 100vh; background: var(--white); border-right: 1px solid var(--border); padding: 20px; position: fixed; box-sizing: border-box; z-index: 100; top: 0; }
        nav h2 { font-size: 1.4rem; color: var(--primary); margin-bottom: 25px; margin-top: 10px; }
        #searchInput { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        nav ul { list-style: none; padding: 0; }
        nav li { padding: 12px 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        nav li:hover { background: #bce2fd; } 
        nav li.active { background: var(--primary); color: white; }

        /* Main Content Area */
        main { margin-left: 280px; padding: 0 40px 40px 40px; width: calc(100% - 280px); box-sizing: border-box; }

        /* =======================================================
           🚀 UT-STYLE PREMIUM HEADER DESIGN (WARNA TETAP ASLI)
           ======================================================= */
        .ut-header-wrapper {
            margin-left: -40px;
            margin-right: -40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        /* Layer 1: Bar Atas */
        .ut-top-yellow-bar {
            background-color: var(--white);
            padding: 10px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            border-bottom: 1px solid var(--border);
        }
        .ut-top-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ut-top-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .ut-mini-search {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 6px 15px;
            border-radius: 20px;
            width: 180px;
            outline: none;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .ut-mini-search:focus {
            border-color: var(--primary);
            width: 220px;
        }
        .ut-social-icons {
            display: flex;
            gap: 10px;
            font-size: 1rem;
        }

        /* Layer 2: Bar Utama (Main Navbar Putih) */
        .ut-main-navbar {
            background: var(--white);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ut-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
            cursor: pointer;
        }
        .ut-brand-logo {
            background: var(--primary);
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 1rem;
        }
        .ut-nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
