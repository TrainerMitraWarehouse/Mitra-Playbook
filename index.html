<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitra Playbook</title>
    <style>
        :root {
            --primary: #033980;
            --bg: #64b1fa;
            --text: #1e293b;
            --border: #bce2fd;
            --white: #ffffff;
        }
        
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--bg); color: var(--text); }
        
        /* --- SIDEBAR KIRI --- */
        nav { width: 280px; height: 100vh; background: var(--white); border-right: 1px solid var(--border); padding: 20px; position: fixed; box-sizing: border-box; z-index: 100; top: 0; left: 0; }
        nav h2 { font-size: 1.4rem; color: var(--primary); margin-bottom: 25px; margin-top: 10px; }
        #searchInput { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        nav ul { list-style: none; padding: 0; margin: 0; }
        nav li { padding: 12px 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        nav li:hover { background: #bce2fd; } 
        nav li.active { background: var(--primary); color: white; }

        /* --- KONTEN UTAMA --- */
        main { margin-left: 280px; padding: 0 40px 40px 40px; width: calc(100% - 280px); box-sizing: border-box; }

        /* --- NAVBAR HEADER ATAS --- */
        .ut-header-wrapper {
            margin-left: -40px;
            margin-right: -40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            background: var(--white);
        }

        .ut-main-navbar {
            background: var(--white);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
        }
        .ut-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.25rem; color: var(--primary); cursor: pointer; }
        .ut-brand-logo { background: var(--primary); color: white; padding: 6px 10px; border-radius: 8px; font-size: 1rem; }
        .ut-nav-links { display: flex; align-items: center; gap: 25px; list-style: none; margin: 0; padding: 0; }
        .ut-link-item { font-weight: 600; color: var(--text); font-size: 0.95rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
        .ut-link-item:hover { color: var(--primary); }
        .ut-link-item::after { content: '⌃'; transform: rotate(180deg); display: inline-block; font-size: 0.65rem; margin-top: -2px; font-weight: bold; }

        .btn-myut-layout {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 9px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            outline: none;
        }
        .btn-myut-layout:hover { background: var(--primary); color: var(--white); box-shadow: 0 4px 12px rgba(3, 57, 128, 0.2); }

        /* --- BANNER HIGHLIGHT --- */
        .highlight-container {
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(153, 58, 142, 0.15);
            border: 1px solid var(--border);
        }
        .banner-image-wrapper { width: 100%; height: 180px; overflow: hidden; position: relative; }
        .banner-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .running-text-wrapper { background: var(--primary); color: white; padding: 10px 0; white-space: nowrap; overflow: hidden; position: relative; display: flex; align-items: center; }
        .running-text { display: inline-block; padding-left: 100%; font-weight: 700; font-size: 1.1rem; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        .running-text-wrapper:hover .running-text { animation-play-state: paused; }

        /* --- ELEMEN KONTEN SECTIONS --- */
        .content-section { display: none; } 
        .content-section.active { display: block; } 
        .card { background: white; padding: 25px; border-radius: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .badge { background: #bce2fd; color: var(--primary); padding: 6px 15px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        h3 { color: var(--primary); margin: 15px 0 10px 0; font-size: 1.5rem; }
        p { line-height: 1.6; color: #475569; }
        .content-image { max-width: 100%; border-radius: 10px; margin-top: 15px; display: block; }

        /* --- LOGIKA KALKULATOR KOMISI --- */
        .calculator-group { margin-bottom: 15px; }
        .calculator-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text); }
        .calculator-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; outline: none; font-size: 1rem; }
        .calculator-group input:focus { border-color: var(--primary); }
        .btn-hitung { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-hitung:hover { background: #033980; opacity: 0.9; }
        .result-container { margin-top: 20px; display: flex; gap: 15px; flex-wrap: wrap; }
        .result-box { flex: 1; min-width: 200px; padding: 15px; background: var(--white); border-left: 5px solid var(--primary); border-radius: 4px; border: 1px solid var(--border); border-left-width: 5px; }
        .result-box h4 { margin: 0 0 5px 0; color: var(--text); }
        .result-box p { margin: 0; font-size: 1.3rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

    <nav>
        <h2>Mitra Playbook</h2>
        <input type="text" id="searchInput" placeholder="Cari materi..." onkeyup="searchGlobal()">
        <ul id="menuList">
